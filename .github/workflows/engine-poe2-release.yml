name: Engine (PoE2 Release Gate)

# Clean real-engine release gate for pob24agents (PoE2).
# Caching is strictly disabled (enable-cache: false) so PR/branch caches can never feed a release gate.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-poe2-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' && !startsWith(github.ref, 'refs/tags/') }}

# uv installs packages only; the interpreter is always the official CPython from setup-python.
env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  windows:
    name: Engine PoE2 Release (Windows, native LuaJIT _lua-host)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          activate-environment: true
          # No cache: this workflow gates releases, so PR/branch caches must not feed it.
          enable-cache: false

      - name: Install package and dev tools from the lockfile
        run: uv sync --project pob2_cli --locked --extra dev --no-editable --active

      - name: Build standalone Windows x64 binary (PyInstaller)
        run: pyinstaller --noconfirm --clean pob2_cli/packaging/pob2.spec

      - name: Bootstrap live slim PoB2 engine
        env:
          POB2_RUNTIME_DIR: ${{ runner.temp }}/pob2-win-rt
          POB2_ENGINE_DIR: ""
          POB2_ROOT: ""
        run: |
          foreach ($attempt in 1..3) {
            pob2 bootstrap --json
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "pob2 bootstrap failed after $attempt attempts" }
            Write-Host "::warning::pob2 bootstrap attempt $attempt failed; retrying in $($attempt * 20)s"
            Start-Sleep -Seconds ($attempt * 20)
          }
          Get-ChildItem "$env:POB2_RUNTIME_DIR/engine" | Select-Object Name, Length
          if (-not (Test-Path "$env:POB2_RUNTIME_DIR/engine/PoE2/lua51.dll")) {
            throw "Slim Windows PoE2 engine is missing PoE2/lua51.dll"
          }

      - name: Smoke-test standalone pob2.exe against the real engine
        env:
          POB2_RUNTIME_DIR: ${{ runner.temp }}/pob2-win-rt
          POB2_ENGINE_DIR: ""
          POB2_ROOT: ""
        run: |
          $exe = Join-Path (Resolve-Path "dist/pob2") "pob2.exe"
          function Invoke-Pob2 {
            $out = & $exe @args 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) {
              Write-Host "=== daemon.log ==="
              Get-Content -LiteralPath "$env:POB2_RUNTIME_DIR/daemon.log" -ErrorAction SilentlyContinue
              throw "pob2.exe $($args -join ' ') failed with exit $LASTEXITCODE. Output: $out"
            }
            return $out
          }
          $about = Invoke-Pob2 about --json
          Write-Host $about
          $status = Invoke-Pob2 status --json | ConvertFrom-Json
          Write-Host "Engine: $($status | ConvertTo-Json -Depth 4 -Compress)"
          Invoke-Pob2 ground "Spirit" --json | Out-Null
          Invoke-Pob2 stop --json | Out-Null
          Write-Host "Frozen pob2.exe real-engine smoke test passed."

      - name: Run full PoE2 gate against the real engine
        env:
          POB2_ENGINE_DIR: ${{ runner.temp }}/pob2-win-rt/engine
        run: |
          python pob2_cli/scripts/check.py
          if ($LASTEXITCODE -ne 0) { throw "pob2 check.py full gate failed (exit $LASTEXITCODE)" }

  posix:
    name: Engine PoE2 Release (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
            label: macOS-arm64
          - os: ubuntu-latest
            label: Linux-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          activate-environment: true
          # No cache: this workflow gates releases, so PR/branch caches must not feed it.
          enable-cache: false

      - name: Install package and dev tools from the lockfile
        run: uv sync --project pob2_cli --locked --extra dev --no-editable --active

      - name: Put Homebrew OpenSSL 3 first on PATH (macOS)
        if: runner.os == 'macOS'
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      - name: Build native POSIX LuaJIT 2460b3f + lua-utf8 runtime
        run: |
          chmod +x pob2_cli/packaging/build_posix_runtime.sh
          ./pob2_cli/packaging/build_posix_runtime.sh runtime-dist

      - name: End-to-end live PoB2 bootstrap & headless CLI verification
        env:
          POB2_RUNTIME_DIR: ${{ runner.temp }}/pob2-e2e-rt
          POB2_ENGINE_DIR: ""
          POB2_ROOT: ""
        run: |
          trap 'echo "=== daemon.log ==="; cat "$POB2_RUNTIME_DIR/daemon.log" 2>/dev/null || true' ERR
          mkdir -p "$POB2_RUNTIME_DIR/engine"
          cp -R runtime-dist/bin "$POB2_RUNTIME_DIR/engine/bin"

          for attempt in 1 2 3; do
            if pob2 bootstrap --json; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "pob2 bootstrap failed after $attempt attempts" >&2
              exit 1
            fi
            echo "::warning::pob2 bootstrap attempt $attempt failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done

          pob2 about --json
          pob2 status --json
          pob2 ground "Spirit" --json
          pob2 stop --json

      - name: Run full PoE2 gate against the real engine
        env:
          POB2_ENGINE_DIR: ${{ runner.temp }}/pob2-e2e-rt/engine
        run: |
          python3 pob2_cli/scripts/check.py
