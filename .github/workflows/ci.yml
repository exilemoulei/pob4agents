name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "pob_cli/**"
      - "install.ps1"
      - "install.sh"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "pob_cli/**"
      - "install.ps1"
      - "install.sh"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# uv installs packages only; the interpreter is always the official CPython from setup-python.
env:
  UV_PYTHON_DOWNLOADS: never

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks give the same result on every OS, so they run once here.
  lint:
    name: Lint & architecture gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          activate-environment: true
          cache-dependency-glob: "pob_cli/uv.lock"

      - name: Install package and dev tools from the lockfile
        # Non-editable, so tests and smoke checks run against the installed package data.
        run: uv sync --project pob_cli --locked --extra dev --no-editable --active

      - name: Run lint & architecture gate (fast + self-test)
        run: |
          python3 pob_cli/scripts/check.py --fast
          python3 pob_cli/scripts/check.py --self-test

  test-and-package:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          activate-environment: true
          cache-dependency-glob: "pob_cli/uv.lock"

      - name: Install package and dev tools from the lockfile
        # Non-editable, so tests and smoke checks run against the installed package data.
        run: uv sync --project pob_cli --locked --extra dev --no-editable --active

      - name: Run unit tests (offline mode)
        env:
          POB_OFFLINE: "1"
        run: |
          python -m pytest pob_cli/tests -v

      - name: Check install.ps1's Ed25519 verifier (PowerShell 7 and Windows PowerShell 5.1)
        run: |
          ./install.ps1 -SelfTest
          powershell -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -SelfTest failed under Windows PowerShell 5.1" }

      - name: Verify installed CLI entry point
        run: |
          pob --version
          pob --help | Out-Null
          pob _daemon --help | Out-Null

      - name: Build Python wheel and sdist
        run: |
          python -m build pob_cli --outdir dist-py
          Get-ChildItem dist-py

      - name: Build standalone Windows x64 binary (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean pob_cli/packaging/pob.spec

      - name: Smoke-test standalone pob.exe (including frozen _daemon spawn)
        run: |
          $exe = Join-Path (Resolve-Path "dist/pob") "pob.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "pob.exe --version failed" }
          & $exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe --help failed" }
          & $exe _daemon --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe _daemon --help failed" }
          & $exe timeless --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe timeless --help failed (missing bundled cli_timeless?)" }
          & $exe diagnose --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe diagnose --help failed" }
          & $exe ground "Divine Blessing with Hatred" --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe ground failed (missing bundled guardrails/game_data?)" }
          & $exe data tick coc --cdr 14 --aps 8.28 --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe data tick failed" }
          & $exe bench list --slot gloves --limit 3 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe bench list failed (missing bundled bench_costs.json?)" }
          & $exe bench suggest --slot gloves --stat "to Cold Resistance" --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe bench suggest failed" }
          & $exe trade convert --text "Rarity: RARE`nDoom Hand`nSlink Gloves`nImplicits: 0`n+42% to Fire Resistance" --to cold --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe trade convert failed" }

          # Verify frozen daemon subprocess spawns and fast-fails cleanly when no engine exists
          $rt = Join-Path $env:RUNNER_TEMP "pob-smoke-rt"
          New-Item -ItemType Directory -Path $rt -Force | Out-Null
          $env:POB_RUNTIME_DIR = $rt
          $env:POB_LEGACY_DIR = ""
          $env:POB_OFFLINE = "1"
          $out = & $exe status 2>&1 | Out-String
          $code = $LASTEXITCODE
          if ($code -ne 1) {
            throw "Expected exit code 1 for bootstrap_missing, got $code. Output: $out"
          }
          if ($out -notmatch "bootstrap") {
            throw "Expected bootstrap guidance in stderr. Output: $out"
          }
          Write-Host "Frozen pob.exe smoke test passed."
          exit 0

  # Engine-less, offline tests; the real-engine gate lives in engine.yml (nightly + release).
  # The 3.11 leg keeps the requires-python floor honest, since install.sh runs on whatever
  # system python3 a macOS/Linux user has.
  unit-posix:
    name: Unit tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux-x64, Python 3.11 floor
            python: "3.11"
          - os: ubuntu-latest
            label: Linux-x64
            python: "3.14"
            tag: linux-x64
          # GitHub labels its macOS 27 arm64 image xcode-27.
          - os: xcode-27
            label: macOS-arm64
            python: "3.14"
            tag: darwin-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
          cache-dependency-glob: "pob_cli/uv.lock"

      - name: Install package and dev tools from the lockfile
        # Non-editable, so tests and smoke checks run against the installed package data.
        run: uv sync --project pob_cli --locked --extra dev --no-editable --active

      - name: Run unit tests (offline mode)
        env:
          POB_OFFLINE: "1"
        run: |
          python3 -m pytest pob_cli/tests -q

      # install.sh users compile this runtime themselves, so the build script stays covered here.
      - name: Build native POSIX LuaJIT + lua-utf8 runtime
        if: matrix.tag
        run: |
          chmod +x pob_cli/packaging/build_posix_runtime.sh
          ./pob_cli/packaging/build_posix_runtime.sh runtime-dist
          tar -czf "pob-runtime-${{ matrix.tag }}.tar.gz" -C runtime-dist bin
          ls -lh "pob-runtime-${{ matrix.tag }}.tar.gz"

      - name: Upload prebuilt POSIX runtime artifact
        if: matrix.tag
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pob-runtime-${{ matrix.tag }}
          path: pob-runtime-${{ matrix.tag }}.tar.gz
