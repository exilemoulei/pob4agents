version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Bumps pyproject.toml ranges and the CI/release lockfile pob_cli/uv.lock together.
  - package-ecosystem: "uv"
    directory: "/pob_cli"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Bumps pyproject.toml ranges and the lockfile pob2_cli/uv.lock together.
  - package-ecosystem: "uv"
    directory: "/pob2_cli"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
